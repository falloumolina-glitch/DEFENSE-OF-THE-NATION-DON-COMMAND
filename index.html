<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEFENSE OF THE NATION COMMAND</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>DEFENSE OF THE NATION COMMAND</h1>

<div id="chrono">00:00</div>
<button class="btn" onclick="startChrono()">LANCER MISSION</button>
<button class="btn" onclick="stopChrono()">PAUSE</button>

<h2>MISSIONS</h2>
<button class="btn" onclick="setMission('POINT ALPHA')">MISSION 1: POINT ALPHA</button>
<button class="btn" onclick="setMission('CONVOI')">MISSION 2: CONVOI</button>

<h2>RADIO</h2>
<button class="btn btn-radio" onclick="log('CONTACT ENNEMI !')">CONTACT !</button>
<button class="btn btn-radio" onclick="log('BESOIN MÉDECIN')">MÉDECIN !</button>

<h2>ÉQUIPES</h2>
<div class="team"><h3>ARMÉE BLEUE</h3>Score: <span id="scoreB">0</span> <button onclick="addScore('B')">+1</button></div>
<div class="team"><h3>ARMÉE ROUGE</h3>Score: <span id="scoreR">0</span> <button onclick="addScore('R')">+1</button></div>

<h2>LOG DE MISSION</h2>
<div id="log"></div>

<script src="script.js"></script>
</body>
  </html>
